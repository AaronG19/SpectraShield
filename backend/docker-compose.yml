version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-security-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agent_security
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-security-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-security-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agent_security
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      - VT_API_KEY=${VT_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - AUTO_RESPONSE_ENABLED=${AUTO_RESPONSE_ENABLED:-true}
      - BEHAVIORAL_ANALYSIS_ENABLED=${BEHAVIORAL_ANALYSIS_ENABLED:-true}
      - ML_ENABLED=${ML_ENABLED:-false}
      - RISK_SCORE_THRESHOLD_LOW=${RISK_SCORE_THRESHOLD_LOW:-20}
      - RISK_SCORE_THRESHOLD_MEDIUM=${RISK_SCORE_THRESHOLD_MEDIUM:-40}
      - RISK_SCORE_THRESHOLD_HIGH=${RISK_SCORE_THRESHOLD_HIGH:-65}
      - RISK_SCORE_THRESHOLD_CRITICAL=${RISK_SCORE_THRESHOLD_CRITICAL:-85}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - AGENTIC_MODE=${AGENTIC_MODE}
    volumes:
      - .:/app
      - agent_security_logs:/var/log/agent_security
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  agent-security-frontend:
    image: node:20-alpine
    container_name: agent-security-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - agent-security-backend
    restart: unless-stopped

volumes:
  postgres_data:
  agent_security_data:
  agent_security_logs:
